<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Hall - Estamparia</title>

    <meta name="theme-color" content="#5b08eb">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/hall.css">
    <link rel="stylesheet" href="css/tema.css">
    <script src="js/tema.js"></script>

</head>

<body>

    <div class="cabecalho">

        <h1>Estamparia</h1>

        <p>Sistema de pedidos</p>

    </div>


    <div class="principal">

        <h2>Menu Principal</h2>


        <div class="opcoes">

            <button onclick="irParaPedidos()">
                Pedidos
            </button>

        <button onclick="window.location.href='adpedidos.html'">
    Adicionar Pedido
       </button>


            <button onclick="configuracoes()">
                Configurações
            </button>

        </div>

        <section id="painelTema" class="painel-tema" role="dialog" aria-modal="true" aria-labelledby="tituloTema" hidden>
            <div class="painel-tema-conteudo">
                <button class="fechar-tema" type="button" onclick="fecharConfiguracoes()" aria-label="Fechar configurações">×</button>
                <h2 id="tituloTema">Configurações</h2>
                <p>Escolha o tema de cores do site.</p>
                <div class="escolha-tema" role="group" aria-label="Tema">
                    <button type="button" onclick="definirTema('claro')">Tema claro</button>
                    <button type="button" onclick="definirTema('escuro')">Tema escuro</button>
                </div>
            </div>
        </section>

    </div>

    <script src="js/pwa.js"></script>

    <script src="js/hall.js"></script>

</body>

</html>
