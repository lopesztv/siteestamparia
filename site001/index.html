<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- Tag essencial para o site ficar responsivo no telemóvel/celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login - Estamparia</title>

    <meta name="theme-color" content="#5b08eb">
    
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login">

        <h1>Estamparia</h1>

        <p>Sistema de pedidos</p>

        <input
            type="text"
            id="usuario"
            placeholder="Usuário"
        >

        <input
            type="password"
            id="senha"
            placeholder="Senha"
        >

        <button onclick="entrar()">
            Entrar
        </button>

        <p id="mensagem"></p>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
