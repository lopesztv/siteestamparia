<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0e7fb"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Estamparia">
  <link rel="apple-touch-icon" href="imagens/apple-touch-icon.png"><link rel="icon" href="imagens/icon192.png" type="image/png"><link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="css/tema.css">
  <script src="js/tema.js"></script><title>Entrar | Estamparia</title>
</head>
<body>
  <main class="login">
    <div class="marca" aria-hidden="true">E</div>
    <p class="eyebrow">GESTÃO DE PRODUÇÃO</p><h1>Estamparia</h1>
    <p class="subtitulo">Acesse o sistema de pedidos</p>
    <form onsubmit="entrar(event)">
      <label for="usuario">Usuário</label><input type="text" id="usuario" placeholder="Seu usuário" autocomplete="username" required>
      <label for="senha">Senha</label><input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required>
      <button type="submit">Entrar <span aria-hidden="true">→</span></button>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="js/login.js"></script><script src="js/pwa.js"></script>
</body>
</html>
