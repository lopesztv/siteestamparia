<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Estamparia"><link rel="apple-touch-icon" href="imagens/apple-touch-icon.png"><link rel="icon" href="imagens/icon192.png" type="image/png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/adpedidos.css"><link rel="stylesheet" href="css/tema.css"><script src="js/tema.js"></script><title>Adicionar pedido | Estamparia</title></head>
<body><header class="cabecalho"><h1>Estamparia</h1><p>Gestão de pedidos</p></header>
<main class="principal">
  <section class="formulario"><p class="eyebrow">NOVO REGISTRO</p><h2>Novo pedido</h2>
    <label for="nomeServico">Nome do serviço</label><input id="nomeServico" type="text" placeholder="Ex.: Camisetas evento 001" maxlength="100" required>
    <label for="quantidade">Quantidade de peças</label><input id="quantidade" type="number" min="1" step="1" placeholder="Ex.: 10" required>
    <fieldset><legend>Tamanhos <span>(unidades por tamanho)</span></legend><div class="tamanhos">
      <label>P<input type="number" id="tamanhoP" min="0" step="1" value="0"></label><label>M<input type="number" id="tamanhoM" min="0" step="1" value="0"></label><label>G<input type="number" id="tamanhoG" min="0" step="1" value="0"></label><label>GG<input type="number" id="tamanhoGG" min="0" step="1" value="0"></label>
    </div></fieldset>
    <label for="corMalha">Cor da malha</label><input id="corMalha" type="text" placeholder="Ex.: Azul turquesa" maxlength="60" required>
    <label for="arte">Arte do serviço <span class="apoio">Imagem opcional · máximo 2 MB</span></label><input id="arte" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
    <label for="dataEntrega">Data de entrega</label><input id="dataEntrega" type="date" required>
    <label for="observacoes">Observações <span class="apoio">Opcional</span></label><textarea id="observacoes" rows="3" maxlength="500" placeholder="Detalhes úteis para a produção"></textarea>
    <button id="criarPedido" type="button" onclick="criarPedido()">Criar pedido</button><button class="voltar" type="button" onclick="voltarHall()">Voltar ao menu</button>
  </section>
  <aside class="pedido"><p class="eyebrow">ACOMPANHAMENTO</p><h2>Resumo do pedido</h2><div id="resultado"><p>Preencha os dados e crie o pedido para ver o resumo.</p></div></aside>
</main><script src="js/adpedidos.js"></script><script src="js/pwa.js"></script></body></html>
